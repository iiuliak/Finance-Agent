services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vat
      POSTGRES_PASSWORD: vat
      POSTGRES_DB: vat
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vat -d vat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
