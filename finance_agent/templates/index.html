<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VAT reserve</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1916;
      --muted: #6d665d;
      --faint: #8a8278;
      --paper: #efeae2;
      --card: #fffcf8;
      --line: #e3dbd0;
      --line-strong: #d3c9bb;
      --reserve: #1c5c40;
      --reserve-soft: #e5f2eb;
      --open: #8a5a12;
      --open-soft: #f8efdc;
      --danger: #8c3a2f;
      --shadow: 0 1px 2px rgba(48, 36, 22, 0.04), 0 16px 40px rgba(48, 36, 22, 0.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(1200px 480px at 10% -10%, rgba(255, 255, 255, 0.7), transparent 55%),
        var(--paper);
      color: var(--ink);
      font: 15px/1.5 "Avenir Next", "Segoe UI", sans-serif;
    }
    main {
      max-width: 76rem;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.75rem 1.25rem 1.25rem;
      gap: 1.25rem;
    }
    header.top h1 {
      margin: 0;
      font-family: Palatino, "Iowan Old Style", Georgia, serif;
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .lede {
      color: var(--muted);
      margin: 0.4rem 0 0;
      max-width: 36rem;
    }
    .layout {
      flex: 1;
      display: grid;
      gap: 1rem;
      align-items: start;
      min-height: 0;
    }
    @media (min-width: 980px) {
      body { height: 100vh; overflow: hidden; }
      main { height: 100vh; }
      .layout { grid-template-columns: 26rem minmax(0, 1fr); min-height: 0; }
      .panel { max-height: 100%; }
      .books { overflow: auto; }
      .chat { overflow: hidden; min-height: 0; }
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }
    .books { padding: 1.15rem 1.15rem 1.35rem; }
    .chat {
      display: flex;
      flex-direction: column;
      min-height: 70vh;
      padding: 1rem 1rem 0.9rem;
    }
    h2, h3 {
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--faint);
      margin: 0 0 0.7rem;
    }
    h3 { margin-top: 1.15rem; }
    .menu { border-top: 1px solid var(--line); margin-top: 0.35rem; }
    .menu summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.8rem 0.1rem;
      cursor: pointer;
      list-style: none;
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--faint);
    }
    .menu summary::-webkit-details-marker { display: none; }
    .menu summary:hover { color: var(--ink); }
    .menu summary::after {
      content: "";
      flex: none;
      width: 0.42rem;
      height: 0.42rem;
      margin-top: -0.2rem;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: rotate(45deg);
    }
    .menu[open] summary::after { margin-top: 0.15rem; transform: rotate(-135deg); }
    .menu .count {
      margin-left: 0.45rem;
      font-weight: 550;
      letter-spacing: 0;
    }
    .menu[open] { padding-bottom: 0.35rem; }
    .menu .editor { margin-top: 0.85rem; }
    .menu .list-error { margin: 0 0 0.35rem; }
    #day-form, #balance-form, .editor {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem 0.65rem;
      margin: 0 0 0.85rem;
    }
    #day-form { grid-template-columns: 1fr auto; align-items: end; }
    label {
      display: grid;
      gap: 0.28rem;
      min-width: 0;
      color: var(--muted);
      font-size: 0.78rem;
    }
    label.wide, form > button.span { grid-column: 1 / -1; justify-self: start; }
    input, textarea, select {
      font: inherit;
      color: inherit;
      width: 100%;
      min-width: 0;
      padding: 0.5rem 0.65rem;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: #fff;
    }
    select {
      appearance: none;
      padding-right: 1.8rem;
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 0.95rem) 55%, calc(100% - 0.65rem) 55%;
      background-size: 0.32rem 0.32rem, 0.32rem 0.32rem;
      background-repeat: no-repeat;
    }
    input:focus, textarea:focus, select:focus {
      outline: 2px solid rgba(28, 92, 64, 0.25);
      border-color: var(--reserve);
    }
    input[aria-invalid="true"], select[aria-invalid="true"] { border-color: var(--danger); }
    input[aria-invalid="true"]:focus, select[aria-invalid="true"]:focus { outline-color: rgba(140, 58, 47, 0.28); }
    .field-error {
      margin: 0;
      color: var(--danger);
      font-size: 0.75rem;
      line-height: 1.35;
    }
    .form-error { grid-column: 1 / -1; }
    .note {
      margin: 0 0 0.9rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem;
      margin: 0 0 1rem;
    }
    .stats p, .balances p, .card .figures p {
      margin: 0;
      padding: 0.7rem 0.75rem;
      border-radius: 12px;
      background: #f7f3ed;
    }
    .stats span, .balances span, .card .figures span {
      display: block;
      color: var(--muted);
      font-size: 0.75rem;
    }
    .stats strong, .balances strong, .card .figures strong {
      display: block;
      margin-top: 0.12rem;
      font-size: 1.12rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .balances {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem;
      margin-bottom: 0.85rem;
    }
    .balances p:last-child { background: var(--reserve-soft); }
    #reserve-balance { color: var(--reserve); }
    .ledger { list-style: none; margin: 0; padding: 0; }
    .ledger li {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.65rem;
      align-items: center;
      min-width: 0;
      padding: 0.7rem 0;
      border-top: 1px solid var(--line);
    }
    .entry { min-width: 0; }
    .amount, .meta { overflow-wrap: anywhere; }
    .amount {
      margin: 0;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }
    .amount span, .meta, .state {
      font-weight: 450;
      color: var(--muted);
      font-size: 0.84rem;
    }
    .meta, .state { margin: 0.12rem 0 0; }
    .pill {
      display: inline-block;
      margin-top: 0.28rem;
      padding: 0.08rem 0.45rem;
      border-radius: 999px;
      font-size: 0.75rem;
      background: var(--reserve-soft);
      color: var(--reserve);
    }
    .pill.open { background: var(--open-soft); color: var(--open); }
    .ledger button { padding: 0.28rem 0.55rem; }
    #transcript {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      overflow: auto;
      padding: 0.15rem 0.15rem 1rem;
      min-height: 16rem;
    }
    .bubble {
      max-width: min(36rem, 92%);
      margin: 0;
      padding: 0.75rem 0.9rem;
      border-radius: 16px;
      background: #f6f2eb;
      white-space: pre-wrap;
    }
    .bubble.user {
      align-self: flex-end;
      background: var(--ink);
      color: #f7f3ed;
      border-bottom-right-radius: 5px;
    }
    .bubble.assistant { align-self: flex-start; border-bottom-left-radius: 5px; }
    .bubble .money { font-variant-numeric: tabular-nums; font-weight: 650; }
    .reply-line { display: block; }
    .reply-line.item { margin: 0.08rem 0 0.08rem 0.15rem; }
    .reply-gap { display: block; height: 0.55rem; }
    .arrive { animation: arrive 0.32s ease; }
    .typing {
      display: flex;
      gap: 0.32rem;
      align-items: center;
      width: fit-content;
      min-height: 1.35rem;
    }
    .typing span {
      width: 0.38rem;
      height: 0.38rem;
      border-radius: 50%;
      background: var(--muted);
      animation: dot 1.1s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes arrive {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes dot {
      0%, 80%, 100% { opacity: 0.25; }
      40% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .arrive, .typing span { animation: none; }
    }
    .card {
      align-self: stretch;
      border: 1px solid var(--line-strong);
      border-radius: 16px;
      background: #fff;
      padding: 0.95rem;
      display: grid;
      gap: 0.8rem;
    }
    .card .figures { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
    .explanation { margin: 0; color: var(--ink); }
    .actions { display: flex; gap: 0.5rem; }
    button, textarea { font: inherit; color: inherit; }
    button {
      border: 1px solid var(--ink);
      background: var(--ink);
      color: white;
      padding: 0.5rem 0.9rem;
      border-radius: 10px;
      cursor: pointer;
    }
    button.secondary { background: transparent; color: var(--ink); }
    button:disabled { opacity: 0.45; cursor: default; }
    #composer {
      display: flex;
      gap: 0.5rem;
      align-items: end;
      padding-top: 0.75rem;
      border-top: 1px solid var(--line);
    }
    textarea {
      flex: 1;
      min-height: 3.1rem;
      max-height: 9rem;
      resize: vertical;
      background: #fff;
    }
    .status { color: var(--reserve); margin: 0; }
    .error { color: var(--danger); margin: 0 0 0.85rem; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    @media (max-width: 640px) {
      .card .figures, .stats, .balances, #day-form, .ledger li { grid-template-columns: 1fr; }
      #day-form button, .ledger button { width: auto; justify-self: start; }
      header.top h1 { font-size: 1.7rem; }
    }
  </style>
</head>
<body>
  <main>
    <header class="top">
      <h1>VAT reserve</h1>
      <p class="lede">This quarter’s VAT, and the money already set aside.</p>
    </header>
    <div class="layout">
    <section class="books panel" aria-label="Account">
      <h2>Account</h2>
      <p id="books-error" class="error" hidden></p>
      <form id="day-form">
        <label>As of
          <input id="as-of" name="as_of" type="date" required aria-describedby="as-of-error">
        </label>
        <button type="submit">Set date</button>
        <p id="as-of-error" class="field-error form-error" data-for="as_of" hidden></p>
      </form>
      <p class="note" id="day-label">As of today.</p>
      <div class="stats" id="today" aria-live="polite">
        <p><span>Due now</span><strong id="due-now">–</strong></p>
        <p><span>Still expected</span><strong id="expected-now">–</strong></p>
        <p><span>Quarter-end</span><strong id="estimate-now">–</strong></p>
        <p><span>Suggested transfer</span><strong id="proposed-now">–</strong></p>
      </div>
      <form id="balance-form">
        <label>Operating
          <input id="operating-input" name="operating_balance" inputmode="decimal" required aria-describedby="operating-error">
          <p id="operating-error" class="field-error" data-for="operating_balance" hidden></p>
        </label>
        <label>Reserve
          <input id="reserve-input" name="reserve_balance" inputmode="decimal" required aria-describedby="reserve-error">
          <p id="reserve-error" class="field-error" data-for="reserve_balance" hidden></p>
        </label>
        <button class="span" type="submit">Save balances</button>
        <p class="field-error form-error" hidden></p>
      </form>
      <details class="menu" id="invoice-menu">
        <summary><span>Invoices <span class="count" id="invoice-count">0</span></span></summary>
        <p class="field-error list-error" hidden></p>
        <ul class="ledger" id="invoices"></ul>
        <form id="invoice-form" class="editor">
          <label>Net
            <input name="net_amount" inputmode="decimal" required placeholder="1000.00" aria-describedby="net-error">
            <p id="net-error" class="field-error" data-for="net_amount" hidden></p>
          </label>
          <label>Rate
            <select name="vat_rate" required aria-describedby="rate-error">
              <option value="0.19" selected>19%</option>
              <option value="0.07">7%</option>
              <option value="0">0%</option>
            </select>
            <p id="rate-error" class="field-error" data-for="vat_rate" hidden></p>
          </label>
          <label>Issued
            <input name="issue_date" type="date" required aria-describedby="issued-error">
            <p id="issued-error" class="field-error" data-for="issue_date" hidden></p>
          </label>
          <label>Paid
            <input name="payment_date" type="date" aria-describedby="paid-error">
            <p id="paid-error" class="field-error" data-for="payment_date" hidden></p>
          </label>
          <label class="wide">Expected
            <input name="expected_payment_date" type="date" aria-describedby="expected-error">
            <p id="expected-error" class="field-error" data-for="expected_payment_date" hidden></p>
          </label>
          <button class="span" type="submit">Add invoice</button>
          <p class="field-error form-error" hidden></p>
        </form>
      </details>
      <details class="menu" id="expense-menu">
        <summary><span>Expenses <span class="count" id="expense-count">0</span></span></summary>
        <p class="field-error list-error" hidden></p>
        <ul class="ledger" id="expenses"></ul>
        <form id="expense-form" class="editor">
          <label>Date
            <input name="expense_date" type="date" required aria-describedby="expense-date-error">
            <p id="expense-date-error" class="field-error" data-for="expense_date" hidden></p>
          </label>
          <label>Gross
            <input name="gross_amount" inputmode="decimal" required placeholder="1190.00" aria-describedby="gross-error">
            <p id="gross-error" class="field-error" data-for="gross_amount" hidden></p>
          </label>
          <label class="wide">Input VAT
            <input name="input_vat_amount" inputmode="decimal" required placeholder="190.00" aria-describedby="input-vat-error">
            <p id="input-vat-error" class="field-error" data-for="input_vat_amount" hidden></p>
          </label>
          <button class="span" type="submit">Add expense</button>
          <p class="field-error form-error" hidden></p>
        </form>
      </details>
    </section>
    <section class="chat panel">
    <div class="balances" aria-live="polite">
      <p><span>Operating</span><strong id="operating-balance">–</strong></p>
      <p><span>Reserve</span><strong id="reserve-balance">–</strong></p>
    </div>
    <div id="transcript" aria-live="polite"></div>
    <form id="composer">
      <label class="sr" for="message">Question</label>
      <textarea id="message" name="message" required placeholder="What is due this quarter?"></textarea>
      <button type="submit">Send</button>
    </form>
    </section>
    </div>
  </main>
  <script>
    const transcript = document.querySelector("#transcript");
    const composer = document.querySelector("#composer");
    const messageBox = document.querySelector("#message");
    const sendButton = composer.querySelector("button");
    const booksError = document.querySelector("#books-error");
    const HISTORY_LIMIT = 20;
    const history = [];
    const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    let booksFingerprint = "";

    function setIfIdle(selector, value) {
      const field = document.querySelector(selector);
      if (document.activeElement === field || field.value === value) return;
      field.value = value;
      field.removeAttribute("aria-invalid");
      hideError(field.form.querySelector('[data-for="' + field.name + '"]'));
    }

    function dayLabel(iso) {
      const [year, month, day] = iso.split("-");
      return Number(day) + " " + MONTHS[Number(month) - 1] + " " + year;
    }

    function optionalDate(value) {
      return value || null;
    }

    function problem(payload) {
      if (typeof payload.detail === "string") return payload.detail;
      if (Array.isArray(payload.detail)) {
        const text = payload.detail.map((item) => item.msg).filter(Boolean).join(" ");
        if (text) return text;
      }
      return "That could not be saved.";
    }

    function showBooksError(text) {
      booksError.hidden = !text;
      booksError.textContent = text || "";
    }

    function hideError(node) {
      if (!node) return;
      node.hidden = true;
      node.textContent = "";
    }

    function showError(node, text) {
      if (!node) return;
      node.hidden = false;
      node.textContent = text;
      const menu = node.closest("details");
      if (menu) menu.open = true;
    }

    function clearForm(form) {
      form.querySelectorAll(".field-error").forEach(hideError);
      form.querySelectorAll("[aria-invalid]").forEach((field) => field.removeAttribute("aria-invalid"));
    }

    function fieldMessage(item, name) {
      const type = item.type || "";
      const raw = String(item.msg || "").replace(/^Value error,\s*/i, "");
      if (/cannot exceed gross_amount/.test(raw)) return "Input VAT cannot be more than the gross amount.";
      if (name === "vat_rate") return "Choose 19%, 7%, or 0%.";
      if (/decimal places/i.test(raw)) return "Use at most 2 decimal places.";
      if (type.includes("decimal") || /valid decimal/i.test(raw)) return "Enter a number.";
      if (type.includes("date") || /date/i.test(raw)) return "Enter a valid date.";
      if (type === "greater_than") return "Use an amount greater than 0.";
      if (type === "greater_than_equal") return "Use 0 or more.";
      if (!raw) return "This value could not be saved.";
      return /[.!?]$/.test(raw) ? raw : raw + ".";
    }

    function fieldName(form, item) {
      const loc = Array.isArray(item.loc) ? item.loc : [];
      const named = loc.findLast((part) => typeof part === "string" && form.elements[part]);
      if (named) return named;
      const raw = String(item.msg || "");
      if (/input_vat_amount/.test(raw) && form.elements.input_vat_amount) return "input_vat_amount";
      if (/gross_amount/.test(raw) && form.elements.gross_amount) return "gross_amount";
      return "";
    }

    function showFieldProblems(form, payload) {
      const items = Array.isArray(payload.detail) ? payload.detail : null;
      if (!items) return false;
      let placed = false;
      items.forEach((item) => {
        const name = fieldName(form, item);
        const field = name ? form.elements[name] : null;
        const slot = name ? form.querySelector('[data-for="' + name + '"]') : null;
        if (!field || !slot) return;
        field.setAttribute("aria-invalid", "true");
        showError(slot, fieldMessage(item, name));
        placed = true;
      });
      if (placed) {
        const first = form.querySelector("[aria-invalid='true']");
        if (first) first.focus({ preventScroll: true });
      }
      return placed;
    }

    function fingerprint(books) {
      return JSON.stringify({
        as_of: books.as_of,
        operating_balance: books.operating_balance,
        reserve_balance: books.reserve_balance,
        invoices: books.invoices.map((invoice) => [invoice.id, invoice.payment_date, invoice.expected_payment_date, invoice.net_amount]),
        expenses: books.expenses.map((expense) => [expense.id, expense.expense_date, expense.gross_amount, expense.input_vat_amount]),
      });
    }

    function appendRich(parent, text) {
      text.split(/\*\*(.+?)\*\*/g).forEach((part, index) => {
        if (index % 2 === 1) {
          const strong = document.createElement("strong");
          strong.textContent = part;
          parent.appendChild(strong);
          return;
        }
        const pieces = part.split(/(€[\d,]+\.\d{2})/g);
        pieces.forEach((piece) => {
          if (/^€[\d,]+\.\d{2}$/.test(piece)) {
            const amount = document.createElement("span");
            amount.className = "money";
            amount.textContent = piece;
            parent.appendChild(amount);
          } else {
            parent.appendChild(document.createTextNode(piece));
          }
        });
      });
    }

    function fillEntry(item, title, meta, pill, tone) {
      const entry = document.createElement("div");
      entry.className = "entry";
      const amount = document.createElement("p");
      amount.className = "amount";
      amount.textContent = title;
      const detail = document.createElement("p");
      detail.className = "meta";
      detail.textContent = meta;
      entry.append(amount, detail);
      if (pill) {
        const badge = document.createElement("p");
        badge.className = "pill" + (tone ? " " + tone : "");
        badge.textContent = pill;
        entry.appendChild(badge);
      }
      const button = document.createElement("button");
      button.type = "button";
      button.className = "secondary";
      button.textContent = "Remove";
      button.addEventListener("click", () => {
        const slot = button.closest(".menu").querySelector(".list-error");
        hideError(slot);
        save(item.url, "DELETE", undefined, slot);
      });
      const row = document.createElement("li");
      row.append(entry, button);
      return row;
    }

    function paint(books) {
      const next = fingerprint(books);
      if (booksFingerprint && next !== booksFingerprint) {
        withdrawOpenCards("The figures changed, so this proposal no longer applies.");
      }
      booksFingerprint = next;
      document.querySelector("#day-label").textContent = "As of " + dayLabel(books.as_of) + ".";
      setIfIdle("#as-of", books.as_of);
      setIfIdle("#operating-input", books.operating_balance);
      setIfIdle("#reserve-input", books.reserve_balance);
      document.querySelector("#operating-balance").textContent = euros(books.operating_balance);
      document.querySelector("#reserve-balance").textContent = euros(books.reserve_balance);
      document.querySelector("#due-now").textContent = euros(books.vat_due);
      document.querySelector("#expected-now").textContent = euros(books.expected_additional_vat);
      document.querySelector("#estimate-now").textContent = euros(books.forecast_vat);
      document.querySelector("#proposed-now").textContent = euros(books.proposed_amount);
      document.querySelector("#invoice-count").textContent = String(books.invoices.length);
      document.querySelector("#expense-count").textContent = String(books.expenses.length);

      const invoices = document.querySelector("#invoices");
      invoices.replaceChildren();
      books.invoices.forEach((invoice) => {
        const paidLater = invoice.payment_date && invoice.payment_date > books.as_of;
        const open = !invoice.payment_date || paidLater;
        const notes = ["VAT " + euros(invoice.vat_amount), "Issued " + dayLabel(invoice.issue_date)];
        if (open && invoice.expected_payment_date) notes.push("Expected " + dayLabel(invoice.expected_payment_date));
        if (paidLater) notes.push("Paid " + dayLabel(invoice.payment_date));
        const pill = open ? "Open" : "Paid " + dayLabel(invoice.payment_date);
        invoices.appendChild(fillEntry(
          { url: "/api/invoices/" + invoice.id },
          euros(invoice.net_amount) + " net",
          notes.join(" · "),
          pill,
          open ? "open" : "",
        ));
      });

      const expenses = document.querySelector("#expenses");
      expenses.replaceChildren();
      books.expenses.forEach((expense) => {
        const later = expense.expense_date > books.as_of;
        expenses.appendChild(fillEntry(
          { url: "/api/expenses/" + expense.id },
          euros(expense.gross_amount),
          dayLabel(expense.expense_date) + " · input VAT " + euros(expense.input_vat_amount),
          later ? "Not included yet" : "",
          later ? "open" : "",
        ));
      });
    }

    async function loadBooks() {
      try {
        const response = await fetch("/api/books");
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          showBooksError(problem(payload));
          return;
        }
        showBooksError("");
        paint(payload);
      } catch {
        showBooksError("The server could not be reached.");
      }
    }

    async function save(url, method, body, target) {
      const form = target && target.tagName === "FORM" ? target : null;
      const slot = form ? form.querySelector(".form-error") : target;
      if (form) clearForm(form);
      else hideError(slot);
      let response;
      try {
        response = await fetch(url, {
          method,
          headers: body === undefined ? {} : { "Content-Type": "application/json" },
          body: body === undefined ? undefined : JSON.stringify(body),
        });
      } catch {
        showError(slot, "The server could not be reached.");
        return;
      }
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        if (form && showFieldProblems(form, payload)) return;
        showError(slot, problem(payload));
        return;
      }
      showBooksError("");
      paint(payload);
      return true;
    }

    document.querySelector("#day-form").addEventListener("submit", (event) => {
      event.preventDefault();
      save("/api/as-of", "PUT", { as_of: document.querySelector("#as-of").value }, event.target);
    });

    document.querySelector("#balance-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const data = new FormData(event.target);
      save("/api/balances", "PUT", {
        operating_balance: data.get("operating_balance"),
        reserve_balance: data.get("reserve_balance"),
      }, event.target);
    });

    document.querySelector("#invoice-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const data = new FormData(event.target);
      const saved = await save("/api/invoices", "POST", {
        net_amount: data.get("net_amount"),
        vat_rate: data.get("vat_rate"),
        issue_date: data.get("issue_date"),
        payment_date: optionalDate(data.get("payment_date")),
        expected_payment_date: optionalDate(data.get("expected_payment_date")),
      }, event.target);
      if (!saved) return;
      event.target.reset();
      event.target.elements.vat_rate.value = "0.19";
    });

    document.querySelector("#expense-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const data = new FormData(event.target);
      const saved = await save("/api/expenses", "POST", {
        expense_date: data.get("expense_date"),
        gross_amount: data.get("gross_amount"),
        input_vat_amount: data.get("input_vat_amount"),
      }, event.target);
      if (saved) event.target.reset();
    });

    document.querySelectorAll("#day-form, #balance-form, #invoice-form, #expense-form").forEach((form) => {
      form.addEventListener("input", () => clearForm(form));
    });

    function euros(value) {
      return new Intl.NumberFormat("en-IE", { style: "currency", currency: "EUR" }).format(Number(value));
    }

    function withdrawOpenCards(text) {
      transcript.querySelectorAll(".card.open").forEach((card) => {
        card.classList.remove("open");
        card.querySelectorAll("button").forEach((button) => button.remove());
        const status = card.querySelector(".status");
        status.hidden = false;
        status.className = "error";
        status.textContent = text;
      });
    }

    function appendLine(parent, line, arrive) {
      if (!line.trim()) {
        const gap = document.createElement("span");
        gap.className = "reply-gap" + (arrive ? " arrive" : "");
        parent.appendChild(gap);
        return;
      }
      const sentences = line.split(/(?<=\.)\s+(?=[A-Z€])/);
      sentences.forEach((sentence) => {
        const row = document.createElement("span");
        row.className = "reply-line" + (/^€/.test(sentence.trim()) ? " item" : "") + (arrive ? " arrive" : "");
        appendRich(row, sentence);
        parent.appendChild(row);
      });
    }

    function fillRich(parent, text) {
      text.replace(/\r\n/g, "\n").split("\n").forEach((line) => appendLine(parent, line, false));
    }

    function reveal(parent, text) {
      const lines = text.replace(/\r\n/g, "\n").split("\n");
      const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!text.trim() || still) {
        fillRich(parent, text);
        transcript.scrollTop = transcript.scrollHeight;
        return Promise.resolve();
      }
      transcript.removeAttribute("aria-live");
      let index = 0;
      parent.replaceChildren();
      return new Promise((resolve) => {
        const step = () => {
          if (index >= lines.length) {
            transcript.scrollTop = transcript.scrollHeight;
            transcript.setAttribute("aria-live", "polite");
            resolve();
            return;
          }
          appendLine(parent, lines[index], true);
          index += 1;
          transcript.scrollTop = transcript.scrollHeight;
          window.setTimeout(step, 70);
        };
        step();
      });
    }

    function addBubble(role, text) {
      const bubble = document.createElement("div");
      bubble.className = "bubble " + role;
      fillRich(bubble, text);
      transcript.appendChild(bubble);
      transcript.scrollTop = transcript.scrollHeight;
      return bubble;
    }

    function showTyping() {
      const bubble = document.createElement("div");
      bubble.className = "bubble assistant typing";
      bubble.setAttribute("aria-label", "Writing a reply");
      bubble.innerHTML = "<span></span><span></span><span></span>";
      transcript.appendChild(bubble);
      transcript.scrollTop = transcript.scrollHeight;
      return bubble;
    }

    async function writeBubble(text) {
      const bubble = document.createElement("div");
      bubble.className = "bubble assistant";
      transcript.appendChild(bubble);
      await reveal(bubble, text);
      return bubble;
    }

    function retireOpenCards() {
      withdrawOpenCards("Replaced by the proposal below.");
    }

    async function addCard(proposal, gradual) {
      retireOpenCards();
      const card = document.createElement("article");
      card.className = "card open";
      card.innerHTML = `
        <div class="figures">
          <p><span>Due now</span><strong></strong></p>
          <p><span>Quarter-end</span><strong></strong></p>
          <p><span>Transfer</span><strong></strong></p>
        </div>
        <p class="explanation"></p>
        <div class="actions">
          <button type="button" data-decision="approve">Approve</button>
          <button type="button" class="secondary" data-decision="reject">Decline</button>
        </div>
        <p class="status" hidden></p>
      `;
      const amounts = card.querySelectorAll(".figures strong");
      amounts[0].textContent = euros(proposal.vat_due);
      amounts[1].textContent = euros(proposal.forecast_vat);
      amounts[2].textContent = euros(proposal.proposed_amount);
      const explanation = card.querySelector(".explanation");
      const status = card.querySelector(".status");
      transcript.appendChild(card);
      if (Number(proposal.proposed_amount) === 0) {
        card.classList.remove("open");
        card.querySelector(".actions").remove();
        status.hidden = false;
        status.textContent = "The reserve already covers the estimate.";
      } else {
        const buttons = [...card.querySelectorAll("button")];
        buttons.forEach((button) => {
          button.addEventListener("click", () => decide(proposal, button.dataset.decision, card, buttons, status));
        });
      }
      if (gradual) await reveal(explanation, proposal.explanation);
      else fillRich(explanation, proposal.explanation);
      transcript.scrollTop = transcript.scrollHeight;
    }

    const OUTCOMES = {
      executed: (proposal) => Number(proposal.proposed_amount) > 0
        ? "Approved. " + euros(proposal.proposed_amount) + " is now in the reserve."
        : "Approved. The reserve already covers the estimate, so nothing moved.",
      rejected: () => "Declined. Nothing moved.",
      failed: () => "The operating account is short. Nothing moved.",
    };

    async function decide(proposal, decision, card, buttons, status) {
      buttons.forEach((button) => { button.disabled = true; });
      status.hidden = false;
      let response;
      try {
        response = await fetch("/api/proposals/" + proposal.id + "/decision", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ decision }),
        });
      } catch {
        status.className = "error";
        status.textContent = "The server could not be reached. Nothing was saved.";
        buttons.forEach((button) => { button.disabled = false; });
        return;
      }
      const body = await response.json().catch(() => ({}));
      if (response.status === 409) {
        card.classList.remove("open");
        buttons.forEach((button) => button.remove());
        status.className = "error";
        status.textContent = body.detail || "This proposal was already decided.";
        return;
      }
      if (!response.ok) {
        status.className = "error";
        status.textContent = "The decision could not be saved.";
        buttons.forEach((button) => { button.disabled = false; });
        return;
      }
      card.classList.remove("open");
      buttons.forEach((button) => button.remove());
      loadBooks();
      status.className = body.status === "failed" ? "error" : "status";
      status.textContent = (OUTCOMES[body.status] || (() => "Status: " + body.status))(proposal);
    }

    messageBox.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" || event.shiftKey || event.isComposing) return;
      event.preventDefault();
      if (!sendButton.disabled) composer.requestSubmit();
    });

    composer.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = messageBox.value.trim();
      if (!message) return;
      addBubble("user", message);
      messageBox.value = "";
      sendButton.disabled = true;
      const typing = showTyping();
      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history: history.slice(-HISTORY_LIMIT) }),
        });
        const body = await response.json().catch(() => ({}));
        typing.remove();
        if (!response.ok) {
          const busy = response.status === 503;
          addBubble("assistant", busy
            ? "The assistant is busy. Try again in a minute."
            : "I couldn't answer just now. Try again.");
          return;
        }
        history.push({ role: "user", content: message });
        if (body.reply) history.push({ role: "assistant", content: body.reply.slice(0, 4000) });
        const showReply = body.reply && (!body.proposal || body.reply !== body.proposal.explanation);
        if (showReply) await writeBubble(body.reply);
        if (body.proposal && Number(body.proposal.proposed_amount) > 0) await addCard(body.proposal, !showReply);
      } catch {
        typing.remove();
        addBubble("assistant", "The server could not be reached.");
      } finally {
        sendButton.disabled = false;
        messageBox.focus();
        loadBooks();
      }
    });

    loadBooks();
  </script>
</body>
</html>
