<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VAT Reserve Agent</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1915;
      --muted: #5c564e;
      --paper: #f6f3ee;
      --card: #fffdf9;
      --line: #ddd6cb;
      --reserve: #1f6b4a;
      --danger: #8c3a2f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.45 "Iowan Old Style", Palatino, Georgia, serif;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1rem 1rem;
    }
    h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 0.25rem; }
    .lede { color: var(--muted); margin: 0 0 1rem; }
    #transcript {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding-bottom: 1rem;
    }
    .bubble {
      max-width: 34rem;
      padding: 0.7rem 0.85rem;
      border: 1px solid var(--line);
      background: var(--card);
    }
    .bubble.user { align-self: flex-end; background: #efeae2; }
    .card {
      border: 1px solid var(--ink);
      background: var(--card);
      padding: 1rem;
      display: grid;
      gap: 0.75rem;
    }
    .balances {
      display: flex;
      gap: 1.5rem;
      padding: 0.6rem 0.85rem;
      margin: 0 0 1rem;
      border: 1px solid var(--line);
      background: var(--card);
    }
    .balances p { margin: 0; }
    .balances span { display: block; color: var(--muted); font-size: 0.8rem; }
    .balances strong { font-size: 1.05rem; }
    #reserve-balance { color: var(--reserve); }
    .figures { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
    .figures span { display: block; color: var(--muted); font-size: 0.8rem; }
    .figures strong { font-size: 1.15rem; }
    .actions { display: flex; gap: 0.5rem; }
    button, textarea {
      font: inherit;
      color: inherit;
    }
    button {
      border: 1px solid var(--ink);
      background: var(--ink);
      color: white;
      padding: 0.45rem 0.8rem;
      cursor: pointer;
    }
    button.secondary { background: transparent; color: var(--ink); }
    button:disabled { opacity: 0.5; cursor: default; }
    form { display: flex; gap: 0.5rem; align-items: end; }
    textarea {
      flex: 1;
      min-height: 3rem;
      resize: vertical;
      padding: 0.5rem;
      border: 1px solid var(--line);
      background: var(--card);
    }
    .status { color: var(--reserve); margin: 0; }
    .error { color: var(--danger); margin: 0; }
    @media (max-width: 640px) {
      .figures { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <h1>VAT reserve</h1>
    <p class="lede">Ask about your balance, invoices, expenses, or VAT. Nothing moves until you approve a card.</p>
    <div class="balances" aria-live="polite">
      <p><span>Operating account</span><strong id="operating-balance">–</strong></p>
      <p><span>Tax reserve</span><strong id="reserve-balance">–</strong></p>
    </div>
    <div id="transcript" aria-live="polite"></div>
    <form id="composer">
      <label for="message" class="lede">Message</label>
      <textarea id="message" name="message" required placeholder="How much VAT do I owe, and what is in the reserve?"></textarea>
      <button type="submit">Send</button>
    </form>
  </main>
  <script>
    const transcript = document.querySelector("#transcript");
    const composer = document.querySelector("#composer");
    const messageBox = document.querySelector("#message");
    const sendButton = composer.querySelector("button");
    const HISTORY_LIMIT = 20;
    const history = [];

    function euros(value) {
      return new Intl.NumberFormat("en-IE", { style: "currency", currency: "EUR" }).format(Number(value));
    }

    async function refreshBalances() {
      try {
        const response = await fetch("/api/balance");
        if (!response.ok) return;
        const body = await response.json();
        document.querySelector("#operating-balance").textContent = euros(body.operating_balance);
        document.querySelector("#reserve-balance").textContent = euros(body.reserve_balance);
      } catch {
        // The balance bar is informational; the chat still works without it.
      }
    }

    function addBubble(role, text) {
      const bubble = document.createElement("p");
      bubble.className = "bubble " + role;
      text.split(/\*\*(.+?)\*\*/g).forEach((part, index) => {
        if (index % 2 === 1) {
          const strong = document.createElement("strong");
          strong.textContent = part;
          bubble.appendChild(strong);
        } else {
          bubble.appendChild(document.createTextNode(part));
        }
      });
      transcript.appendChild(bubble);
    }

    function retireOpenCards() {
      transcript.querySelectorAll(".card.open").forEach((card) => {
        card.classList.remove("open");
        card.querySelectorAll("button").forEach((button) => button.remove());
        const status = card.querySelector(".status");
        status.hidden = false;
        status.className = "error";
        status.textContent = "Replaced by the newer proposal below.";
      });
    }

    function addCard(proposal) {
      retireOpenCards();
      const card = document.createElement("article");
      card.className = "card open";
      card.innerHTML = `
        <div class="figures">
          <p><span>VAT already due</span><strong></strong></p>
          <p><span>Estimated at quarter end</span><strong></strong></p>
          <p><span>Proposed transfer</span><strong></strong></p>
        </div>
        <p class="explanation"></p>
        <div class="actions">
          <button type="button" data-decision="approve">Approve</button>
          <button type="button" class="secondary" data-decision="reject">Reject</button>
        </div>
        <p class="status" hidden></p>
      `;
      const amounts = card.querySelectorAll(".figures strong");
      amounts[0].textContent = euros(proposal.vat_due);
      amounts[1].textContent = euros(proposal.forecast_vat);
      amounts[2].textContent = euros(proposal.proposed_amount);
      card.querySelector(".explanation").textContent = proposal.explanation;
      const status = card.querySelector(".status");
      if (Number(proposal.proposed_amount) === 0) {
        card.classList.remove("open");
        card.querySelector(".actions").remove();
        status.hidden = false;
        status.textContent = "Nothing to approve. Your reserve already covers the estimate.";
        transcript.appendChild(card);
        return;
      }
      const buttons = [...card.querySelectorAll("button")];
      buttons.forEach((button) => {
        button.addEventListener("click", () => decide(proposal, button.dataset.decision, card, buttons, status));
      });
      transcript.appendChild(card);
    }

    const OUTCOMES = {
      executed: (proposal) => Number(proposal.proposed_amount) > 0
        ? "Approved. " + euros(proposal.proposed_amount) + " moved to your reserve."
        : "Approved. Your reserve already covers the estimate, so nothing moved.",
      rejected: () => "Rejected. No money moved.",
      failed: () => "The operating account no longer holds enough. No money moved.",
    };

    async function decide(proposal, decision, card, buttons, status) {
      buttons.forEach((button) => { button.disabled = true; });
      status.hidden = false;
      let response;
      try {
        response = await fetch("/api/proposals/" + proposal.id + "/decision", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ decision }),
        });
      } catch {
        status.className = "error";
        status.textContent = "The server could not be reached. Nothing was saved.";
        buttons.forEach((button) => { button.disabled = false; });
        return;
      }
      const body = await response.json().catch(() => ({}));
      if (response.status === 409) {
        card.classList.remove("open");
        buttons.forEach((button) => button.remove());
        status.className = "error";
        status.textContent = body.detail || "This proposal was already decided.";
        return;
      }
      if (!response.ok) {
        status.className = "error";
        status.textContent = "The decision could not be saved.";
        buttons.forEach((button) => { button.disabled = false; });
        return;
      }
      card.classList.remove("open");
      buttons.forEach((button) => button.remove());
      refreshBalances();
      status.className = body.status === "failed" ? "error" : "status";
      status.textContent = (OUTCOMES[body.status] || (() => "Status: " + body.status))(proposal);
    }

    composer.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = messageBox.value.trim();
      if (!message) return;
      addBubble("user", message);
      messageBox.value = "";
      sendButton.disabled = true;
      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history: history.slice(-HISTORY_LIMIT) }),
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          addBubble("assistant", body.detail || "The assistant could not answer.");
          return;
        }
        history.push({ role: "user", content: message });
        if (body.reply) history.push({ role: "assistant", content: body.reply.slice(0, 4000) });
        if (body.reply && (!body.proposal || body.reply !== body.proposal.explanation)) {
          addBubble("assistant", body.reply);
        }
        if (body.proposal && Number(body.proposal.proposed_amount) > 0) addCard(body.proposal);
      } catch {
        addBubble("assistant", "The server could not be reached.");
      } finally {
        sendButton.disabled = false;
        messageBox.focus();
        refreshBalances();
      }
    });

    refreshBalances();
  </script>
</body>
</html>
